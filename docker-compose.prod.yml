version: "3.9"

services:
  web:
    build: .
    container_name: django_app

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn medibooker.wsgi:application --bind 0.0.0.0:8000
      "

    env_file:
      - .env.prod  # Contains Neon DATABASE_URL

    ports:
      - "8000:8000"

    volumes:
      - media_data:/app/media  # Persist uploaded files (if not using S3)

    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /var/www/medibooker:/var/www/medibooker
    depends_on:
      - web

volumes:
  media_data: