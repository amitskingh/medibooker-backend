[tool.ruff]
line-length = 100
target-version = "py311"

exclude = [
    "migrations",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I"]  # Errors, Pyflakes, Import sorting
ignore = ["E501"]  # Ignore long line errors (optional)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"